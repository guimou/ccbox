# Lets a service account use the codebox-apptainer SCC. Bound per namespace
# by k8s/base/rolebinding.yaml (equivalent to
# `oc adm policy add-scc-to-user codebox-apptainer -z codebox -n <ns>`).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: codebox-apptainer-scc
rules:
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    resourceNames: [codebox-apptainer]
    verbs: [use]
