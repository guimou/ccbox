# Grants the codebox service account the codebox-apptainer SCC (created by
# a cluster-admin from k8s/cluster/)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: codebox-apptainer-scc
  labels:
    app.kubernetes.io/name: codebox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: codebox-apptainer-scc
subjects:
  - kind: ServiceAccount
    name: codebox
