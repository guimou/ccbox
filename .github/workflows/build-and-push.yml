name: Build and Push Container Image

on:
  workflow_call:
    inputs:
      harness:
        description: 'Harness to build: claude, opencode, qwencode, or codex'
        required: true
        type: string
      harness_version:
        description: 'Harness version (leave empty to use the version file)'
        required: false
        type: string
      image_tag:
        description: 'Image tag to apply (e.g., 2.1.37 or 2.1.37-1). Defaults to harness_version.'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      harness:
        description: 'Harness to build'
        required: true
        type: choice
        options:
          - claude
          - opencode
          - qwencode
          - codex
      harness_version:
        description: 'Harness version (leave empty to use the version file)'
        required: false
        type: string
      image_tag:
        description: 'Image tag to apply (e.g., 2.1.37 or 2.1.37-1). Defaults to harness_version.'
        required: false
        type: string

env:
  REGISTRY: quay.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve harness parameters
        id: harness
        run: |
          case "${{ inputs.harness }}" in
            claude)
              IMAGE_NAME="guimou/ccbox"
              VERSION_FILE="CLAUDE_VERSION"
              ;;
            opencode)
              IMAGE_NAME="guimou/ocbox"
              VERSION_FILE="OPENCODE_VERSION"
              ;;
            qwencode)
              IMAGE_NAME="guimou/qcbox"
              VERSION_FILE="QWENCODE_VERSION"
              ;;
            codex)
              IMAGE_NAME="guimou/cxbox"
              VERSION_FILE="CODEX_VERSION"
              ;;
            *)
              echo "Unknown harness: ${{ inputs.harness }}" >&2
              exit 1
              ;;
          esac

          if [ -n "${{ inputs.harness_version }}" ]; then
            VERSION="${{ inputs.harness_version }}"
          elif [ -f "$VERSION_FILE" ]; then
            VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")
          else
            VERSION=""
          fi

          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Harness: ${{ inputs.harness }} -> ${IMAGE_NAME} (version: ${VERSION:-latest})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.harness.outputs.image_name }}
          tags: |
            type=raw,value=${{ inputs.image_tag || steps.harness.outputs.version }},enable=${{ inputs.image_tag != '' || steps.harness.outputs.version != '' }}
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            HARNESS=${{ inputs.harness }}
            HARNESS_VERSION=${{ steps.harness.outputs.version }}
          cache-from: type=gha,scope=${{ inputs.harness }}
          cache-to: type=gha,mode=max,scope=${{ inputs.harness }}
