name: Build and Push Container Image

# Builds ONE harness image on top of a published codebox-base tag and pushes
# it to that harness's Quay repository. Optionally creates the git tag and
# GitHub Release for it in the same job, so each harness release is a
# self-contained unit: a failure here never affects the other harnesses.

on:
  workflow_call:
    inputs:
      harness:
        description: 'Harness to build: claude, opencode, qwencode, or codex'
        required: true
        type: string
      harness_version:
        description: 'Harness version (leave empty to use the version file)'
        required: false
        type: string
      image_tag:
        description: 'Image tag to apply (e.g., 2.1.37 or 2.1.37-1). Defaults to harness_version.'
        required: false
        type: string
      base_tag:
        description: 'codebox-base tag to build from (leave empty to derive it from the checked-out commit)'
        required: false
        type: string
      git_tag:
        description: 'Git tag / GitHub Release to create after a successful push (e.g. ccbox-v2.1.37). Leave empty to only push the image.'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      harness:
        description: 'Harness to build'
        required: true
        type: choice
        options:
          - claude
          - opencode
          - qwencode
          - codex
      harness_version:
        description: 'Harness version (leave empty to use the version file)'
        required: false
        type: string
      image_tag:
        description: 'Image tag to apply (e.g., 2.1.37 or 2.1.37-1). Defaults to harness_version.'
        required: false
        type: string
      base_tag:
        description: 'codebox-base tag to build from (leave empty to derive it from this commit; it must already be published)'
        required: false
        type: string

env:
  REGISTRY: quay.io
  BASE_IMAGE_NAME: guimou/codebox-base

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve harness parameters
        id: harness
        run: |
          case "${{ inputs.harness }}" in
            claude)
              IMAGE_NAME="guimou/ccbox"
              VERSION_FILE="CLAUDE_VERSION"
              ;;
            opencode)
              IMAGE_NAME="guimou/ocbox"
              VERSION_FILE="OPENCODE_VERSION"
              ;;
            qwencode)
              IMAGE_NAME="guimou/qcbox"
              VERSION_FILE="QWENCODE_VERSION"
              ;;
            codex)
              IMAGE_NAME="guimou/cxbox"
              VERSION_FILE="CODEX_VERSION"
              ;;
            *)
              echo "Unknown harness: ${{ inputs.harness }}" >&2
              exit 1
              ;;
          esac

          if [ -n "${{ inputs.harness_version }}" ]; then
            VERSION="${{ inputs.harness_version }}"
          elif [ -f "$VERSION_FILE" ]; then
            VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")
          else
            VERSION=""
          fi

          # Base tag: explicit input, or the content tag of the base inputs at
          # this commit (same rule as build-base.yml)
          BASE_TAG="${{ inputs.base_tag }}"
          if [ -z "$BASE_TAG" ]; then
            BASE_TAG=$(git log -1 --format=%H -- Dockerfile.base os-packages.txt init-firewall.sh | cut -c1-12)
          fi
          if [ -z "$BASE_TAG" ]; then
            echo "Could not determine base image tag" >&2
            exit 1
          fi

          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "base_image=${REGISTRY}/${BASE_IMAGE_NAME}:${BASE_TAG}" >> $GITHUB_OUTPUT
          echo "Harness: ${{ inputs.harness }} -> ${IMAGE_NAME} (version: ${VERSION:-latest})"
          echo "Base:    ${REGISTRY}/${BASE_IMAGE_NAME}:${BASE_TAG}"

      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Verify the base image exists
        run: |
          BASE="${{ steps.harness.outputs.base_image }}"
          if ! docker manifest inspect "$BASE" >/dev/null 2>&1; then
            echo "::error::Base image ${BASE} not found. Run the 'Build Base Image' workflow first (or let the Release workflow build it)."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.harness.outputs.image_name }}
          tags: |
            type=raw,value=${{ inputs.image_tag || steps.harness.outputs.version }},enable=${{ inputs.image_tag != '' || steps.harness.outputs.version != '' }}
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.harness.outputs.base_image }}
            HARNESS=${{ inputs.harness }}
            HARNESS_VERSION=${{ steps.harness.outputs.version }}
          cache-from: type=gha,scope=${{ inputs.harness }}
          cache-to: type=gha,mode=max,scope=${{ inputs.harness }}

      - name: Create git tag and GitHub Release
        if: inputs.git_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.git_tag }}"
          IMAGE_TAG="${{ inputs.image_tag || steps.harness.outputs.version }}"
          BOX="${TAG%%-v*}"

          # Find previous release tag of this harness for the changelog range
          # (fall back to legacy unprefixed v* tags used before multi-harness)
          PREV_TAG=$(git tag --list "${BOX}-v*" --sort=-version:refname | head -1)
          if [ -z "$PREV_TAG" ] && [ "$BOX" = "ccbox" ]; then
            PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          fi

          # Build release notes with PR-style content
          NOTES="Container image: \`${REGISTRY}/${{ steps.harness.outputs.image_name }}:${IMAGE_TAG}\`"
          NOTES="${NOTES}"$'\n'"Base image: \`${{ steps.harness.outputs.base_image }}\`"
          NOTES="${NOTES}"$'\n\n'"## Changes"$'\n'
          if [ -n "$PREV_TAG" ]; then
            NOTES="${NOTES}$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)' --reverse)"
          else
            NOTES="${NOTES}$(git log --pretty=format:'- %s (%h)' --reverse)"
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"
