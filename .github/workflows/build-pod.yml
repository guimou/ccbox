name: Build Pod Image

# Builds k8s/Containerfile (the slim UBI9 image a long-lived coding pod runs
# on Kubernetes/OpenShift: Apptainer + tmux + the launchers) and pushes it to
# quay.io/guimou/codebox-pod as `latest` and the commit SHA. It has no
# harness or version inside, so it is not part of the per-harness release
# flow: it rebuilds whenever its inputs (the Containerfile, the entrypoint,
# the launchers, the engine) change on main. Pull requests touching the
# image inputs build it without pushing, so a broken Containerfile is
# caught before merge.

on:
  pull_request:
    paths:
      - 'k8s/Containerfile'
      - 'k8s/entrypoint.sh'
      - '.github/workflows/build-pod.yml'
  push:
    branches: [main]
    paths:
      - 'k8s/Containerfile'
      - 'k8s/entrypoint.sh'
      - 'ccbox'
      - 'ocbox'
      - 'qcbox'
      - 'cxbox'
      - 'lib/**'
      - '.github/workflows/build-pod.yml'
  workflow_dispatch:

env:
  REGISTRY: quay.io
  IMAGE_NAME: guimou/codebox-pod

jobs:
  build-pod:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Quay.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push pod image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: k8s/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=pod
          cache-to: type=gha,mode=max,scope=pod
