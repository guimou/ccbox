name: Release

# Release orchestration:
#   1. detect  - figure out which harnesses need a (re)build and with which tags
#   2. base    - build the shared codebox-base image once (skipped when the
#                content tag already exists in the registry)
#   3. build   - one independent job per harness, FROM that exact base tag;
#                each job pushes its image and creates its own git tag and
#                GitHub Release, so one failing harness never blocks another
#
# A weekly scheduled run (and the manual "rebuild all" dispatch) forces a
# base rebuild to pick up Fedora package updates, then rebuilds every harness
# as a -N suffixed release of its current pinned version.

on:
  push:
    branches: [main]
    paths:
      # Harness version pins
      - 'CLAUDE_VERSION'
      - 'OPENCODE_VERSION'
      - 'QWENCODE_VERSION'
      - 'CODEX_VERSION'
      # Base image inputs (rebuild the base, then all harnesses)
      - 'Dockerfile.base'
      - 'os-packages.txt'
      - 'init-firewall.sh'
      # Shared harness-stage / launcher files (rebuild all harnesses)
      - 'Dockerfile'
      - 'firewall-domains.txt'
      - 'lib/**'
      # Harness-specific files
      - 'firewall-domains-claude.txt'
      - 'firewall-domains-opencode.txt'
      - 'firewall-domains-qwencode.txt'
      - 'firewall-domains-codex.txt'
      - 'ccbox'
      - 'ocbox'
      - 'qcbox'
      - 'cxbox'
  schedule:
    # Weekly refresh of the base (Fedora updates) and all harnesses
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: 'Force-rebuild the base image and every harness (-N releases)'
        required: false
        type: boolean
        default: true

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}
      force_base: ${{ steps.detect.outputs.force_base }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect harnesses to release
        id: detect
        run: |
          # Scheduled runs and manual "rebuild all" dispatches refresh everything
          REBUILD_ALL=false
          if [ "${{ github.event_name }}" = "schedule" ] || \
             { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.rebuild_all }}" = "true" ]; }; then
            REBUILD_ALL=true
          fi

          if [ "$REBUILD_ALL" = "true" ]; then
            CHANGED=""
            SHARED_CHANGED=true
            FORCE_BASE=true
            echo "Full refresh requested (${{ github.event_name }})"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            echo "Changed files:"
            echo "$CHANGED"

            # Shared files trigger a rebuild of every harness
            SHARED_CHANGED=false
            if echo "$CHANGED" | grep -qE '^(Dockerfile|Dockerfile\.base|os-packages\.txt|firewall-domains\.txt|init-firewall\.sh|lib/)'; then
              SHARED_CHANGED=true
            fi
            # Base inputs produce a new base content tag; build-base.yml skips
            # the build when the tag already exists, so no force is needed
            FORCE_BASE=false
          fi

          MATRIX="[]"

          add_harness() {
            local harness="$1" box="$2" version_file="$3" launcher="$4" overlay="$5"

            local version
            version=$(tr -d '[:space:]' < "$version_file")
            if [ -z "$version" ]; then
              echo "::warning::${version_file} is empty, skipping ${box}"
              return
            fi

            local git_tag image_tag
            # A version bump releases the plain version; any other relevant
            # change releases a -N suffixed rebuild of the current version
            if [ "$REBUILD_ALL" != "true" ] && git diff HEAD~1 HEAD -- "$version_file" | grep -q '^[+-][0-9]'; then
              git_tag="${box}-v${version}"
              image_tag="${version}"
            elif [ "$SHARED_CHANGED" = "true" ] || echo "$CHANGED" | grep -qE "^(${launcher}|${overlay})$"; then
              local escaped last n
              escaped=$(echo "$version" | sed 's/\./\\./g')
              last=$(git tag --list "${box}-v${version}-*" | sed "s/${box}-v${escaped}-//" | sort -n | tail -1)
              if [ -z "$last" ]; then
                n=1
              else
                n=$((last + 1))
              fi
              git_tag="${box}-v${version}-${n}"
              image_tag="${version}-${n}"
            else
              echo "No relevant changes for ${box}, skipping"
              return
            fi

            if git rev-parse "$git_tag" >/dev/null 2>&1; then
              echo "Tag ${git_tag} already exists, skipping ${box}"
              return
            fi

            echo "Will release ${box}: git tag ${git_tag}, image tag ${image_tag}"
            MATRIX=$(echo "$MATRIX" | jq -c \
              --arg harness "$harness" --arg box "$box" \
              --arg git_tag "$git_tag" --arg image_tag "$image_tag" \
              '. + [{harness: $harness, box: $box, git_tag: $git_tag, image_tag: $image_tag}]')
          }

          add_harness claude   ccbox CLAUDE_VERSION   ccbox firewall-domains-claude.txt
          add_harness opencode ocbox OPENCODE_VERSION ocbox firewall-domains-opencode.txt
          add_harness qwencode qcbox QWENCODE_VERSION qcbox firewall-domains-qwencode.txt
          add_harness codex    cxbox CODEX_VERSION    cxbox firewall-domains-codex.txt

          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "force_base=${FORCE_BASE}" >> $GITHUB_OUTPUT
          if [ "$MATRIX" = "[]" ]; then
            echo "any=false" >> $GITHUB_OUTPUT
          else
            echo "any=true" >> $GITHUB_OUTPUT
          fi

  # Build (or reuse) the shared base once, only if at least one harness needs it
  base:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    uses: ./.github/workflows/build-base.yml
    with:
      force: ${{ needs.detect.outputs.force_base == 'true' }}
    secrets: inherit

  # One independent job per harness: build FROM the base tag, push, tag, release
  build:
    needs: [detect, base]
    if: needs.detect.outputs.any == 'true'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/build-and-push.yml
    with:
      harness: ${{ matrix.harness }}
      image_tag: ${{ matrix.image_tag }}
      base_tag: ${{ needs.base.outputs.base_tag }}
      git_tag: ${{ matrix.git_tag }}
    secrets: inherit
