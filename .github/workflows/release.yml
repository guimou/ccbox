name: Release

on:
  push:
    branches: [main]
    paths:
      # Harness version pins
      - 'CLAUDE_VERSION'
      - 'OPENCODE_VERSION'
      - 'QWENCODE_VERSION'
      # Shared image/launcher files (affect all harnesses)
      - 'Dockerfile'
      - 'os-packages.txt'
      - 'firewall-domains.txt'
      - 'init-firewall.sh'
      - 'lib/**'
      # Harness-specific files
      - 'firewall-domains-claude.txt'
      - 'firewall-domains-opencode.txt'
      - 'firewall-domains-qwencode.txt'
      - 'ccbox'
      - 'ocbox'
      - 'qcbox'

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      any: ${{ steps.detect.outputs.any }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect harnesses to release
        id: detect
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Shared files trigger a rebuild of every harness
          SHARED_CHANGED=false
          if echo "$CHANGED" | grep -qE '^(Dockerfile|os-packages\.txt|firewall-domains\.txt|init-firewall\.sh|lib/)'; then
            SHARED_CHANGED=true
          fi

          MATRIX="[]"

          add_harness() {
            local harness="$1" box="$2" version_file="$3" launcher="$4" overlay="$5"

            local version
            version=$(tr -d '[:space:]' < "$version_file")
            if [ -z "$version" ]; then
              echo "::warning::${version_file} is empty, skipping ${box}"
              return
            fi

            local git_tag image_tag
            # A version bump releases the plain version; any other relevant
            # change releases a -N suffixed rebuild of the current version
            if git diff HEAD~1 HEAD -- "$version_file" | grep -q '^[+-][0-9]'; then
              git_tag="${box}-v${version}"
              image_tag="${version}"
            elif [ "$SHARED_CHANGED" = "true" ] || echo "$CHANGED" | grep -qE "^(${launcher}|${overlay})$"; then
              local escaped last n
              escaped=$(echo "$version" | sed 's/\./\\./g')
              last=$(git tag --list "${box}-v${version}-*" | sed "s/${box}-v${escaped}-//" | sort -n | tail -1)
              if [ -z "$last" ]; then
                n=1
              else
                n=$((last + 1))
              fi
              git_tag="${box}-v${version}-${n}"
              image_tag="${version}-${n}"
            else
              echo "No relevant changes for ${box}, skipping"
              return
            fi

            if git rev-parse "$git_tag" >/dev/null 2>&1; then
              echo "Tag ${git_tag} already exists, skipping ${box}"
              return
            fi

            echo "Will release ${box}: git tag ${git_tag}, image tag ${image_tag}"
            MATRIX=$(echo "$MATRIX" | jq -c \
              --arg harness "$harness" --arg box "$box" \
              --arg git_tag "$git_tag" --arg image_tag "$image_tag" \
              '. + [{harness: $harness, box: $box, git_tag: $git_tag, image_tag: $image_tag}]')
          }

          add_harness claude   ccbox CLAUDE_VERSION   ccbox firewall-domains-claude.txt
          add_harness opencode ocbox OPENCODE_VERSION ocbox firewall-domains-opencode.txt
          add_harness qwencode qcbox QWENCODE_VERSION qcbox firewall-domains-qwencode.txt

          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          if [ "$MATRIX" = "[]" ]; then
            echo "any=false" >> $GITHUB_OUTPUT
          else
            echo "any=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: detect
    if: needs.detect.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    uses: ./.github/workflows/build-and-push.yml
    with:
      harness: ${{ matrix.harness }}
      image_tag: ${{ matrix.image_tag }}
    secrets: inherit

  release:
    needs: [detect, build]
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ matrix.git_tag }}"
          IMAGE_TAG="${{ matrix.image_tag }}"
          BOX="${{ matrix.box }}"

          # Find previous release tag of this harness for the changelog range
          # (fall back to legacy unprefixed v* tags used before multi-harness)
          PREV_TAG=$(git tag --list "${BOX}-v*" --sort=-version:refname | head -1)
          if [ -z "$PREV_TAG" ] && [ "$BOX" = "ccbox" ]; then
            PREV_TAG=$(git tag --list 'v*' --sort=-version:refname | head -1)
          fi

          # Build release notes with PR-style content
          NOTES="Container image: \`quay.io/guimou/${BOX}:${IMAGE_TAG}\`"
          NOTES="${NOTES}"$'\n\n'"## Changes"$'\n'
          if [ -n "$PREV_TAG" ]; then
            NOTES="${NOTES}$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)' --reverse)"
          else
            NOTES="${NOTES}$(git log --pretty=format:'- %s (%h)' --reverse)"
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"
